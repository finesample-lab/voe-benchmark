name: Verify benchmark

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m emb validate
      - run: python -m emb score examples/reference-predictions.jsonl
      - run: python -m unittest discover -s tests -v
