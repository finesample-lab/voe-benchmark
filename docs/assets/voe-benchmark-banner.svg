<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Voe Benchmark. Prove the memory can show its work.</title>
  <desc id="desc">A Voe-branded banner for the public benchmark of evidence-native company memory systems.</desc>
  <rect width="1200" height="360" fill="#ECF1EF"/>
  <path d="M0 306 C176 279 307 330 471 304 S765 281 936 308 S1096 326 1200 295 V360 H0 Z" fill="#E2EDEA"/>
  <path d="M0 306 C176 279 307 330 471 304 S765 281 936 308 S1096 326 1200 295" fill="none" stroke="#2F6D64" stroke-width="2" opacity="0.62"/>

  <text x="72" y="72" fill="#12242A" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600">voe benchmark</text>
  <text x="72" y="116" fill="#7A8E90" font-family="Instrument Sans, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.2">PUBLIC · REPEATABLE · SYSTEM-NEUTRAL</text>
  <text x="72" y="184" fill="#12242A" font-family="Fraunces, Georgia, serif" font-size="52" font-weight="500">Prove the memory can</text>
  <text x="72" y="241" fill="#12242A" font-family="Fraunces, Georgia, serif" font-size="52" font-weight="500">show its work.</text>
  <text x="72" y="278" fill="#3A5257" font-family="Instrument Sans, Arial, sans-serif" font-size="18">Score the evidence path, not the fluency of the answer.</text>

  <g transform="translate(790 67)" font-family="Instrument Sans, Arial, sans-serif">
    <text x="0" y="0" fill="#7A8E90" font-size="12" font-weight="600" letter-spacing="1.5">SEVEN DIMENSIONS</text>
    <g transform="translate(0 24)">
      <rect width="282" height="188" rx="14" fill="#F7FAF9" stroke="#D4DEDB"/>
      <g fill="#2F6D64">
        <rect x="24" y="24" width="9" height="9" rx="2"/>
        <rect x="24" y="46" width="9" height="9" rx="2"/>
        <rect x="24" y="68" width="9" height="9" rx="2"/>
        <rect x="24" y="90" width="9" height="9" rx="2"/>
        <rect x="24" y="112" width="9" height="9" rx="2"/>
        <rect x="24" y="134" width="9" height="9" rx="2"/>
        <rect x="24" y="156" width="9" height="9" rx="2"/>
      </g>
      <g x="48" fill="#12242A" font-size="14" font-weight="600">
        <text x="48" y="33">Capture fidelity</text>
        <text x="48" y="55">Retrieval</text>
        <text x="48" y="77">Claim accuracy</text>
        <text x="48" y="99">Provenance</text>
        <text x="48" y="121">Gaps</text>
        <text x="48" y="143">Decision</text>
        <text x="48" y="165">Lifecycle</text>
      </g>
    </g>
    <rect x="0" y="228" width="282" height="34" rx="17" fill="#F5EBDB"/>
    <text x="141" y="250" text-anchor="middle" fill="#A66A1F" font-size="13" font-weight="600">Critical failures cannot average away</text>
  </g>
</svg>
