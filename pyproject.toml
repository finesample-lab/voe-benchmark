[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voe-benchmark"
version = "0.1.0"
description = "A deterministic benchmark for evidence-native company memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "fineSample"}]
dependencies = []

[project.scripts]
emb = "emb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
